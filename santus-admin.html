<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Santus Logistics Dashboard</title>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="container">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

<h1>Santus Logistics Dashboard</h1>

<button
onclick="logout()"
style="
background:#e74c3c;
color:white;
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
">
Logout
</button>

</div>

<div class="stats">

<div class="stat-card">
<h2 id="totalShipments">0</h2>
<p>Total Shipments</p>
</div>

<div class="stat-card">
<h2 id="inTransit">0</h2>
<p>In Transit</p>
</div>

<div class="stat-card">
<h2 id="delivered">0</h2>
<p>Delivered</p>
</div>

<div class="stat-card">
<h2 id="processing">0</h2>
<p>Processing</p>
</div>

</div>

<div class="form-section">

<input type="text"
id="id"
placeholder="Auto Generated"
readonly>

<input type="text"
id="customerName"
placeholder="Customer Name">

<input type="text"
id="customerPhone"
placeholder="Customer Phone">

<input type="text"
id="receiverName"
placeholder="Receiver Name">

<input type="text"
id="receiverPhone"
placeholder="Receiver Phone">

<input type="text"
id="origin"
placeholder="Origin">

<input type="text"
id="destination"
placeholder="Destination">

<select id="status">

<option>Warehouse Processing</option>
<option>In Transit</option>
<option>Custom Clearance</option>
<option>Delivered</option>

</select>

<input
type="text"
id="location"
placeholder="Current Location">

<input
type="text"
id="eta"
placeholder="Estimated Delivery">

<!-- NEW -->

<input
type="date"
id="shipmentDate">

<input
type="text"
id="weight"
placeholder="Weight (KG)">

<select id="shippingMethod">

<option>Air Freight ✈️</option>
<option>Sea Freight 🚢</option>
<option>Road Freight 🚚</option>

</select>

<select id="packageType">

<option>Document</option>
<option>Parcel</option>
<option>Electronics</option>
<option>Furniture</option>
<option>Cargo</option>
<option>Vehicle</option>

</select>

<select id="paymentStatus">

<option>Paid</option>
<option>Pending</option>

</select>

<input
type="text"
id="description"
placeholder="Package Description">

<button onclick="createShipment()">
Create
</button>

<button onclick="updateShipment()">
Update
</button>

</div>

<div class="search-section">

<input
type="text"
id="searchInput"
placeholder="Search Tracking ID">

<button onclick="searchShipment()">
Search
</button>

<button onclick="loadShipments()">
Reset
</button>

</div>

</div>

<h2>All Shipments</h2>

<div id="shipmentList"></div>

</div>

<script src="admin.js"></script>

</body>
</html>
