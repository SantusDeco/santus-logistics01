<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Santus Logistics Dashboard</title>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="container">
<!-- =========================
Enterprise Header
========================= -->

<header class="dashboard-header">

    <div class="header-left">

        <h1>🚚 Santus Logistics</h1>

        <p>Enterprise Admin Dashboard</p>

    </div>

    <div class="header-center">

        <div id="currentDate"></div>

        <div id="currentTime"></div>

    </div>

    <div class="header-right">

        <span class="welcome-text">

            Welcome, Admin

        </span>

        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>

</header>
<div class="stats">

<div class="stat-card">

<div class="stat-icon">📦</div>

<h2 id="totalShipments">0</h2>

<h3>Total Shipments</h3>

<p>All Registered Shipments</p>

</div>

<div class="stat-card">

<div class="stat-icon">🚚</div>

<h2 id="inTransit">0</h2>

<h3>In Transit</h3>

<p>Currently Moving</p>

</div>

<div class="stat-card">

<div class="stat-icon">✅</div>

<h2 id="delivered">0</h2>

<h3>Delivered</h3>

<p>Completed Deliveries</p>

</div>

<div class="stat-card">

<div class="stat-icon">🏭</div>

<h2 id="processing">0</h2>

<h3>Processing</h3>

<p>Warehouse Processing</p>

</div>

</div>
<div class="form-section">

<input type="text"
id="id"
placeholder="Auto Generated"
readonly>

<input type="text"
id="customerName"
placeholder="Customer Name">

<input type="text"
id="customerPhone"
placeholder="Customer Phone">

<input type="text"
id="receiverName"
placeholder="Receiver Name">

<input type="text"
id="receiverPhone"
placeholder="Receiver Phone">

<input type="text"
id="origin"
placeholder="Origin">

<input type="text"
id="destination"
placeholder="Destination">

<select id="status">

<option>Warehouse Processing</option>
<option>In Transit</option>
<option>Custom Clearance</option>
<option>Delivered</option>

</select>

<input
type="text"
id="location"
placeholder="Current Location">

<input
type="text"
id="eta"
placeholder="Estimated Delivery">

<!-- NEW -->

<input
type="date"
id="shipmentDate">

<input
type="text"
id="weight"
placeholder="Weight (KG)">

<select id="shippingMethod">

<option>Air Freight ✈️</option>
<option>Sea Freight 🚢</option>
<option>Road Freight 🚚</option>

</select>

<select id="packageType">

<option>Document</option>
<option>Parcel</option>
<option>Electronics</option>
<option>Furniture</option>
<option>Cargo</option>
<option>Vehicle</option>

</select>

<select id="paymentStatus">

<option>Paid</option>
<option>Pending</option>

</select>

<input
type="text"
id="description"
placeholder="Package Description">

<button onclick="createShipment()">
Create
</button>

<button onclick="updateShipment()">
Update
</button>

</div>

<div class="search-section">

<input
type="text"
id="searchInput"
placeholder="Search Tracking ID">

<button onclick="searchShipment()">
Search
</button>

<button onclick="loadShipments()">
Reset
</button>

</div>

</div>

<h2>All Shipments</h2>

<div id="shipmentList"></div>

</div>

<div id="detailsModal" class="details-modal">

    <div class="details-content">

        <span
        class="close-details"
        onclick="closeShipmentDetails()">

        &times;

        </span>

        <h2>Shipment Details</h2>

        <div id="detailsBody"></div>

    </div>

</div>

<script src="auth.js"></script>
<script src="api.js"></script>
<script src="toast.js"></script>
<script src="modal.js"></script>
<script src="admin.js"></script>
</body>
</html>
