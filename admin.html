<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Santus Logistics Dashboard</title>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="container">

<h1>Santus Logistics Dashboard</h1>

<div class="stats">

<div class="stat-card">
<h2 id="totalShipments">0</h2>
<p>Total Shipments</p>
</div>

<div class="stat-card">
<h2 id="inTransit">0</h2>
<p>In Transit</p>
</div>

<div class="stat-card">
<h2 id="delivered">0</h2>
<p>Delivered</p>
</div>

<div class="stat-card">
<h2 id="processing">0</h2>
<p>Processing</p>
</div>

</div>

<div class="form-section">

<input type="text" id="id" placeholder="Auto Generated" readonly>

<input type="text"
id="customerName"
placeholder="Customer Name">

<input type="text"
id="customerPhone"
placeholder="Customer Phone">

<input type="text"
id="receiverName"
placeholder="Receiver Name">

<input type="text"
id="receiverPhone"
placeholder="Receiver Phone">

<input type="text"
id="origin"
placeholder="Origin">

<input type="text"
id="destination"
placeholder="Destination">

<select id="status">

<option>Warehouse Processing</option>

<option>In Transit</option>

<option>Custom Clearance</option>

<option>Delivered</option>

</select>

<input type="text"
id="location"
placeholder="Current Location">

<input type="text"
id="eta"
placeholder="ETA">

<button onclick="createShipment()">
Create
</button>

<button onclick="updateShipment()">
Update
</button>

</div>

<div class="search-section">

<input
type="text"
id="searchInput"
placeholder="Search Tracking ID">

<button onclick="searchShipment()">
Search
</button>

<button onclick="loadShipments()">
Reset
</button>

</div>

</div>

<h2>All Shipments</h2>

<div id="shipmentList"></div>

</div>

<script src="admin.js"></script>

</body>
</html>
