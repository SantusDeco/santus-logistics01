<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Santus Logistics Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#0f766e);
}

.login-box{
width:400px;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo h1{
color:#0f766e;
font-size:32px;
}

.logo p{
color:#666;
margin-top:5px;
}

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

.input-group input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#0f766e;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#115e59;
}

#error{
margin-top:15px;
color:red;
text-align:center;
font-weight:bold;
}

.footer{
margin-top:20px;
text-align:center;
font-size:13px;
color:#666;
}

</style>
</head>

<body>

<div class="login-box">

<div class="logo">
<h1>SANTUS</h1>
<p>Logistics Admin Portal</p>
</div>

<div class="input-group">
<label>Username</label>
<input
type="text"
id="username"
placeholder="Enter Username">
</div>

<div class="input-group">
<label>Password</label>
<input
type="password"
id="password"
placeholder="Enter Password">
</div>

<button onclick="login()">
Login
</button>

<p id="error"></p>

<div class="footer">
Santus Logistics Secure Dashboard
</div>

</div>

<script>

const API =
"https://santus-logistics01.onrender.com";

async function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const res = await fetch(
`${API}/admin-login`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username,
password
})
}
);

const data = await res.json();

if(data.success){

localStorage.setItem(
"adminLoggedIn",
"true"
);

window.location.href =
"santus-admin.html";

}else{

alert(
"Invalid Username or Password"
);

}

}

</script>

</body>
</html>
